server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN__ __WWW_DOMAIN__;

    root /var/www/depression-check/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
